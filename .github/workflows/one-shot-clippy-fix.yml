name: One-shot Clippy Fix

on:
  push:
    branches:
      - agent/project-remediation-modernization

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-remediation-modernization
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf
      - name: Apply machine-applicable Clippy fixes
        run: |
          cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt --all
      - name: Commit fixes if any
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No machine-applicable changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix machine-applicable Clippy warnings"
          git push origin HEAD:agent/project-remediation-modernization

# Triggered once for final mechanical lint cleanup; remove this workflow after it commits.
