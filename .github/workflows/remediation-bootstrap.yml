name: Remediation Bootstrap

on:
  push:
    branches:
      - agent/project-remediation-modernization
  pull_request:
    branches:
      - codex/project-audit-cleanup-plan

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair deterministic compile blockers
        shell: python
        run: |
          from pathlib import Path

          plugins = Path('apps/desktop/src-tauri/src/commands/plugins.rs')
          text = plugins.read_text(encoding='utf-8')
          old = 'use tauri::State;'
          new = 'use tauri::{Manager, State};'
          if old not in text and new not in text:
              raise SystemExit('plugins.rs tauri import shape changed unexpectedly')
          plugins.write_text(text.replace(old, new, 1), encoding='utf-8')

          audio = Path('apps/desktop/src-tauri/src/audio_commands.rs')
          text = audio.read_text(encoding='utf-8')
          old = '''let brr = {
                  let audio = state.audio_state.lock();
                  audio.imported_samples.lock().get(&sound_id).cloned()
              }'''
          new = '''let brr = {
                  let audio = state.audio_state.lock();
                  let imported = audio.imported_samples.lock();
                  imported.get(&sound_id).cloned()
              }'''
          count = text.count(old)
          if count not in (0, 3):
              raise SystemExit(f'expected 0 or 3 audio lock patterns, found {count}')
          if count:
              audio.write_text(text.replace(old, new), encoding='utf-8')

          rom_lib = Path('crates/rom-core/src/lib.rs')
          text = rom_lib.read_text(encoding='utf-8')
          marker = 'pub mod comparison;\npub use comparison::*;\n'
          addition = 'pub mod edit;\npub use edit::*;\n\n'
          if 'pub mod edit;' not in text:
              if marker not in text:
                  raise SystemExit('rom-core module marker changed unexpectedly')
              text = text.replace(marker, marker + '\n' + addition, 1)
              rom_lib.write_text(text, encoding='utf-8')

      - name: Remove tracked generated build artifacts
        run: git rm -r --ignore-unmatch target2 target3

      - name: Generate Rust lockfile
        run: cargo generate-lockfile

      - name: Generate frontend lockfile
        working-directory: apps/desktop
        run: npm install --package-lock-only --ignore-scripts

      - name: Normalize Rust whitespace
        shell: python
        run: |
          from pathlib import Path
          for path in Path('.').rglob('*.rs'):
              if any(part.startswith('target') for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              normalized = '\n'.join(line.rstrip() for line in text.splitlines()) + '\n'
              if normalized != text:
                  path.write_text(normalized, encoding='utf-8')

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Validate whitespace
        run: git diff --check

      - name: Commit bootstrap results
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit."
          else
            git commit -m "Recover reproducible build baseline"
            git push origin HEAD:${TARGET_BRANCH}
          fi
