name: CI

on:
  push:
    branches: [main, develop, agent/project-remediation-modernization]
  pull_request:
    branches: [main, codex/project-audit-cleanup-plan]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  remediation-apply:
    name: Apply Remediation Transforms
    if: github.event_name == 'pull_request' && github.event.action == 'reopened' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-remediation-modernization
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Apply deterministic transforms
        run: |
          python scripts/ci/apply_remediation_transforms.py
          python scripts/ci/register_stable_commands.py
          python scripts/ci/migrate_asset_commands.py
          python scripts/ci/migrate_comparison_commands.py
          python scripts/ci/gate_animation_mutations.py
          cargo generate-lockfile
          cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged || true
          cargo fmt --all
      - name: Verify transformed Rust workspace
        run: cargo check --workspace
      - name: Verify transformed frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npx tsc --noEmit
      - name: Commit transformed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remediation transforms remain to commit."
          else
            git commit -m "Apply deterministic remediation transforms"
            git pull --rebase origin agent/project-remediation-modernization
            git push origin HEAD:agent/project-remediation-modernization
          fi

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude tauri-appsuper-punch-out-editor --verbose

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high

  contracts:
    name: Contracts and Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/ci/check_command_contract.py
      - run: python scripts/ci/check_versions.py
      - run: python scripts/ci/check_repository_hygiene.py

  smoke-manifest-bundle:
    name: Manifest bundle path smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest bundle path resolves
        run: |
          MANIFEST_DIR="data/manifests"
          test -d "$MANIFEST_DIR" || { echo "ERROR: $MANIFEST_DIR not found"; exit 1; }
          COUNT=$(ls -1 "$MANIFEST_DIR"/*.json 2>/dev/null | wc -l)
          test "$COUNT" -gt 0 || { echo "ERROR: no .json files in $MANIFEST_DIR"; exit 1; }
          for f in "$MANIFEST_DIR"/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || exit 1
          done

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
