name: Development Snapshot

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [.github/workflows/development-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Archive tracked source only
        run: |
          mkdir -p /tmp/dev-snapshot
          git archive --format=tar.gz HEAD > /tmp/dev-snapshot/source.tar.gz
          git rev-parse HEAD > /tmp/dev-snapshot/COMMIT.txt
      - run: npm ci
        working-directory: apps/desktop
      - name: Archive locked frontend test dependencies separately
        run: tar -czf /tmp/dev-snapshot/frontend-test-deps.tar.gz -C apps/desktop node_modules
      - name: Prepare locked core test dependencies
        run: cargo test --locked -p rom-core --no-run
      - name: Preserve pinned offline Rust tools and dependency cache
        run: |
          root=$(rustc --print sysroot)
          tar -czf /tmp/dev-snapshot/rust-tools.tar.gz -C "$root" bin/rustc bin/rustdoc bin/cargo bin/rustfmt bin/clippy-driver bin/cargo-clippy lib
          tar -czf /tmp/dev-snapshot/rust-registry.tar.gz -C "$CARGO_HOME" registry
      - uses: actions/upload-artifact@v4
        with:
          name: development-snapshot-not-release
          path: /tmp/dev-snapshot
          retention-days: 1
          if-no-files-found: error
