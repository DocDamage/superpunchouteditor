name: Community Windows Tester Kit

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: community-tester-kit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Build and certify shareable tester kit
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: Windows-community-kit-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: Windows-community-kit-cargo-

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run frontend tests
        working-directory: apps/desktop
        run: npm test

      - name: Typecheck and build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Build unsigned NSIS tester installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          # Community-test packaging never substitutes for the production signed-release workflow.
          # Disable updater-artifact generation only so PR/test builds need no signing secrets.
          npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Locate installer and assemble tester kit
        id: kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $roots = @('target', 'apps/desktop/src-tauri/target') | Where-Object { Test-Path $_ }
          $installers = @(
            foreach ($root in $roots) {
              Get-ChildItem -Path $root -Filter '*.exe' -Recurse -File |
                Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' }
            }
          ) | Sort-Object FullName -Unique

          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows NSIS installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          if ($installer.Length -le 0) {
            throw "Installer is empty: $($installer.FullName)"
          }

          $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName

          $kitDir = Join-Path (Get-Location) 'target/community-tester-kit'
          $advancedDir = Join-Path $kitDir 'advanced-evidence'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $kitDir
          New-Item -ItemType Directory -Force -Path $kitDir, $advancedDir | Out-Null

          Copy-Item -LiteralPath $installer.FullName -Destination $kitDir
          Copy-Item -LiteralPath 'docs/COMMUNITY_TESTING.md' -Destination (Join-Path $kitDir 'START_HERE.md')
          Copy-Item -LiteralPath 'docs/WINDOWS_ACCEPTANCE.md' -Destination (Join-Path $advancedDir 'WINDOWS_ACCEPTANCE.md')
          Copy-Item -Path 'scripts/windows/acceptance-*.ps1' -Destination $advancedDir

          @"
          Super Punch-Out!! Editor - Community Windows Tester Kit

          READ START_HERE.md FIRST.

          This is a TEST build, not a production stable release.
          Supply your own legally obtained ROM locally.
          Never upload or share ROMs, SRAM/save states, or emulator binaries with bug reports.

          Source event: $env:GITHUB_EVENT_NAME
          Source ref: $env:GITHUB_REF
          Source commit: $env:GITHUB_SHA
          Installer: $($installer.Name)
          Installer SHA-256: $installerHash
          Installer Authenticode status: $($signature.Status)

          The build is expected to be unsigned unless it came from the separate production signed-release workflow.
          Do not treat this tester kit as proof of production signing.
          "@ | Set-Content -LiteralPath (Join-Path $kitDir 'README_FIRST.txt') -Encoding utf8

          "$installerHash *$($installer.Name)" |
            Set-Content -LiteralPath (Join-Path $kitDir 'CHECKSUMS.txt') -Encoding ascii

          @{
            schemaVersion = 1
            sourceWorkflow = 'Community Windows Tester Kit'
            sourceEvent = $env:GITHUB_EVENT_NAME
            sourceRef = $env:GITHUB_REF
            sourceCommit = $env:GITHUB_SHA
            installerFile = $installer.Name
            installerSizeBytes = $installer.Length
            installerSha256 = $installerHash
            authenticodeStatus = [string]$signature.Status
            windowsLifecycleStatus = 'PENDING'
            generatedAtUtc = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $kitDir 'BUILD_INFO.json') -Encoding utf8

          $forbidden = @(
            Get-ChildItem -Path $kitDir -Recurse -File | Where-Object {
              $_.Extension -in @('.sfc', '.smc', '.srm') -or
              $_.Name -ieq 'SUPERZSNES.exe' -or
              $_.Extension -in @('.state', '.savestate')
            }
          )
          if ($forbidden.Count -gt 0) {
            throw "Forbidden ROM/emulator/save-state content entered tester kit: $($forbidden.FullName -join ', ')"
          }

          $checksumLine = Get-Content -LiteralPath (Join-Path $kitDir 'CHECKSUMS.txt') -Raw
          if ($checksumLine -notmatch [regex]::Escape($installerHash)) {
            throw 'Tester-kit checksum manifest does not contain the installer SHA-256.'
          }

          "path=$kitDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer_path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer_sha256=$installerHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          "## Community tester kit" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Source commit: ``$env:GITHUB_SHA``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Installer SHA-256: ``$installerHash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Authenticode: ``$($signature.Status)``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- ROM/emulator/save-state boundary scan: passed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Exercise exact tester installer lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = '${{ steps.kit.outputs.installer_path }}'
          $expectedHash = '${{ steps.kit.outputs.installer_sha256 }}'
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Installer changed between kit assembly and lifecycle test. Expected $expectedHash, got $actualHash."
          }

          $installDir = Join-Path $env:LOCALAPPDATA 'Super Punch-Out!! Editor'
          $appExe = Join-Path $installDir 'tauri-appsuper-punch-out-editor.exe'
          $uninstaller = Join-Path $installDir 'uninstall.exe'

          if (Test-Path $installDir) {
            throw "Expected a clean runner, but install directory already exists: $installDir"
          }

          $install = Start-Process -FilePath $installer -ArgumentList '/S', '/NS' -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Silent NSIS install failed with exit code $($install.ExitCode)."
          }

          if (-not (Test-Path $appExe -PathType Leaf)) {
            throw "Installed application executable not found: $appExe"
          }
          if (-not (Test-Path $uninstaller -PathType Leaf)) {
            throw "Installed uninstaller not found: $uninstaller"
          }

          $forbiddenInstalled = @(
            Get-ChildItem -Path $installDir -Recurse -File | Where-Object {
              $_.Extension -in @('.sfc', '.smc', '.srm') -or
              $_.Name -ieq 'SUPERZSNES.exe' -or
              $_.Extension -in @('.state', '.savestate')
            }
          )
          if ($forbiddenInstalled.Count -gt 0) {
            throw "Forbidden ROM/emulator/save-state content was installed: $($forbiddenInstalled.FullName -join ', ')"
          }

          $roamingData = Join-Path $env:APPDATA 'com.dferr.super-punch-out-editor'
          $localData = Join-Path $env:LOCALAPPDATA 'com.dferr.super-punch-out-editor'
          New-Item -ItemType Directory -Force -Path $roamingData, $localData | Out-Null
          Set-Content -LiteralPath (Join-Path $roamingData 'community-kit-preserve.txt') -Value 'preserve-on-uninstall'
          Set-Content -LiteralPath (Join-Path $localData 'community-kit-preserve.txt') -Value 'preserve-on-uninstall'

          $app = Start-Process -FilePath $appExe -PassThru
          Start-Sleep -Seconds 10
          $app.Refresh()
          if ($app.HasExited) {
            throw "Installed tester application exited during launch smoke with code $($app.ExitCode)."
          }

          Stop-Process -Id $app.Id -Force
          Wait-Process -Id $app.Id -ErrorAction SilentlyContinue

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Silent NSIS uninstall failed with exit code $($uninstall.ExitCode)."
          }

          if (Test-Path $appExe -PathType Leaf) {
            throw "Application executable still exists after uninstall: $appExe"
          }
          if (-not (Test-Path (Join-Path $roamingData 'community-kit-preserve.txt') -PathType Leaf)) {
            throw 'Default uninstall removed the roaming application-data marker.'
          }
          if (-not (Test-Path (Join-Path $localData 'community-kit-preserve.txt') -PathType Leaf)) {
            throw 'Default uninstall removed the local application-data marker.'
          }

          "- Exact packaged installer lifecycle: passed (install, launch, boundary scan, uninstall, app-data preservation)" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Record lifecycle certification in tester kit
        shell: pwsh
        run: |
          $kitDir = '${{ steps.kit.outputs.path }}'
          $buildInfoPath = Join-Path $kitDir 'BUILD_INFO.json'
          $buildInfo = Get-Content -LiteralPath $buildInfoPath -Raw | ConvertFrom-Json
          $buildInfo.windowsLifecycleStatus = 'PASS'
          $buildInfo | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $buildInfoPath -Encoding utf8

          Add-Content -LiteralPath (Join-Path $kitDir 'README_FIRST.txt') -Encoding utf8 -Value @"

          Exact packaged-installer Windows lifecycle: PASS
          - silent install
          - installed application launch
          - installed-content ROM/emulator/save-state boundary scan
          - silent uninstall
          - application-data preservation
          "@

      - name: Upload community tester kit
        uses: actions/upload-artifact@v4
        with:
          name: super-punch-out-editor-community-tester-kit
          path: ${{ steps.kit.outputs.path }}
          if-no-files-found: error
          retention-days: 14
