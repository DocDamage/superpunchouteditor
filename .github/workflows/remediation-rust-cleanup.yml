name: Remediation Rust Cleanup

on:
  push:
    branches:
      - agent/project-remediation-modernization
  pull_request:
    branches:
      - codex/project-audit-cleanup-plan

concurrency:
  group: remediation-rust-cleanup
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-remediation-modernization
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Apply deterministic remediation transforms
        run: python scripts/ci/apply_remediation_transforms.py
      - name: Regenerate Rust lockfile
        run: cargo generate-lockfile
      - name: Apply machine-safe Clippy fixes
        run: cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged || true
      - name: Format workspace
        run: cargo fmt --all
      - name: Verify workspace compiles
        run: cargo check --workspace
      - name: Verify frontend types
        working-directory: apps/desktop
        run: |
          npm ci
          npx tsc --noEmit
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
          else
            git commit -m "Apply deterministic remediation transforms"
            git pull --rebase origin agent/project-remediation-modernization
            git push origin HEAD:agent/project-remediation-modernization
          fi
