name: Lint

on:
  push:
    branches: [master, develop, agent/project-remediation-modernization]
  pull_request:

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autofix:
    name: One-shot Rust Autofix
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-remediation-modernization
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf
      - name: Apply targeted strict-lint cleanups
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, *, count: int | None = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              occurrences = text.count(old)
              if occurrences == 0:
                  return
              if count is not None and occurrences < count:
                  raise RuntimeError(f"Expected at least {count} occurrence(s) in {path}, found {occurrences}")
              text = text.replace(old, new) if count is None else text.replace(old, new, count)
              file.write_text(text, encoding="utf-8")

          replace_exact(
              "crates/debugger-core/src/cpu/disassembler.rs",
              '''    } else if is_immediate_for_index(def.mnemonic) {
                  def.addressing_mode
                      .operand_size(is_8bit_accumulator, is_8bit_index)
              } else if is_immediate_for_accumulator(def.mnemonic) {
                  def.addressing_mode
                      .operand_size(is_8bit_accumulator, is_8bit_index)
              } else {''',
              '''    } else if is_immediate_for_index(def.mnemonic)
                  || is_immediate_for_accumulator(def.mnemonic)
              {
                  def.addressing_mode
                      .operand_size(is_8bit_accumulator, is_8bit_index)
              } else {''',
          )

          replace_exact(
              "crates/debugger-core/src/memory/mod.rs",
              "        addresses.sort_by(|a, b| b.1.cmp(&a.1));",
              "        addresses.sort_by_key(|entry| std::cmp::Reverse(entry.1));",
              count=None,
          )

          replace_exact(
              "crates/asset-core/src/frame.rs",
              '''    if s.starts_with("0x") {
                  usize::from_str_radix(&s[2..], 16).map_err(|e| e.to_string())
              } else {''',
              '''    if let Some(hex) = s.strip_prefix("0x") {
                  usize::from_str_radix(hex, 16).map_err(|e| e.to_string())
              } else {''',
          )

          replace_exact(
              "crates/debugger-core/src/spc700/mod.rs",
              '''        for i in 0..9 {
                  block[i] = self.state.read_ram(addr.wrapping_add(i as u16));
              }''',
              '''        for (i, byte) in block.iter_mut().enumerate() {
                  *byte = self.state.read_ram(addr.wrapping_add(i as u16));
              }''',
          )

          replace_exact(
              "crates/asset-core/src/spc/mod.rs",
              '''        for i in len..max_len {
                  buffer[i] = 0;
              }''',
              "        buffer[len..max_len].fill(0);",
          )

          replace_exact(
              "crates/relocation-core/src/bank_manager.rs",
              "        free_regions.sort_by(|a, b| b.size.cmp(&a.size));",
              "        free_regions.sort_by_key(|region| std::cmp::Reverse(region.size));",
          )
          replace_exact(
              "crates/relocation-core/src/bank_manager.rs",
              "        gaps.sort_by(|a, b| b.size.cmp(&a.size));",
              "        gaps.sort_by_key(|gap| std::cmp::Reverse(gap.size));",
          )

          replace_exact(
              "crates/relocation-core/src/free_space.rs",
              '''        let average_block_size = if region_count > 0 {
                  total_free / region_count
              } else {
                  0
              };''',
              "        let average_block_size = total_free.checked_div(region_count).unwrap_or(0);",
          )
          PY
      - name: Apply machine-applicable fixes
        run: |
          cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt --all
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix remaining strict Rust lint warnings"
          git push origin HEAD:agent/project-remediation-modernization

  rust:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf

      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  typescript:
    name: TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm audit --audit-level=high

  contracts:
    name: Repository Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: IPC command contract
        run: python scripts/ci/check_command_contract.py
      - name: Version consistency
        run: python scripts/ci/check_versions.py
      - name: Repository hygiene
        run: python scripts/ci/check_repository_hygiene.py
