name: One-shot SPC doctest fix

on:
  push:
    branches:
      - agent/project-remediation-modernization

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-remediation-modernization

      - name: Repair SPC format documentation fence
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/asset-core/src/spc/mod.rs")
          text = path.read_text(encoding="utf-8")
          needle = "//! # File Structure\n//! ```\n//! Offset  Size  Description"
          replacement = "//! # File Structure\n//! ```text\n//! Offset  Size  Description"
          if needle not in text:
              raise SystemExit("expected SPC documentation block not found")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")

      - name: Remove one-shot workflow
        shell: bash
        run: rm .github/workflows/one-shot-spc-doctest-fix.yml

      - name: Verify patch scope
        shell: bash
        run: |
          git diff --check
          git diff -- crates/asset-core/src/spc/mod.rs .github/workflows/one-shot-spc-doctest-fix.yml

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/asset-core/src/spc/mod.rs .github/workflows/one-shot-spc-doctest-fix.yml
          git commit -m "Docs: mark SPC layout as text"
          git push origin HEAD:agent/project-remediation-modernization
